[package]
name = "nitro-tpm-attest"
version = "2.0.0"
description = "Retrieve a signed attestation document from the NitroTPM"
edition = "2024"
authors = ["Marius Knaust <mknaust@amazon.com>"]
repository = "https://github.com/aws/NitroTPM-Tools"
readme = "README.md"
license-file = "../LICENSE"
keywords = ["aws", "nitro", "nitrotpm", "attestation", "tpm"]

[dependencies]
anyhow = "1.0"
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
aws-nitro-enclaves-nsm-api = { version = "0.5", default-features = false }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tss-esapi = "7.7"
# build.rs needs the TSS version tss-esapi-sys reports; Cargo passes it only to direct dependents
tss-esapi-sys = "0.6"

[build-dependencies]
semver = "1.0"

[dev-dependencies]
aws-config = "1.13"
aws-sdk-kms = { version = "1.131", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64ct = { version = "1.8", features = ["alloc"] }
openssl = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "nitro-tpm-kms-decrypt"
path = "examples/kms_decrypt.rs"
