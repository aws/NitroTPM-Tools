name: Publish
on:
  push:
    tags: [ "v*" ]
defaults:
  run:
    shell: bash
jobs:
  ci:
    if: github.repository == 'aws/NitroTPM-Tools'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-latest
    # crates.io trusts this file name and environment
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the crates whose version is not on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | "\(.name) \(.version)"' \
            | {
                published=false
                while read -r name version; do
                  index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
                  if curl --silent --show-error --fail --retry 3 "$index" \
                    | jq --exit-status --arg version "$version" 'select(.vers == $version)' > /dev/null; then
                    echo "$name $version is published already"
                  else
                    cargo publish --locked --no-verify --package "$name" < /dev/null
                    published=true
                  fi
                done
                "$published" || { echo "::error::No crate version is new, so nothing was published"; exit 1; }
              }
